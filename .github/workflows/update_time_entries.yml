name: update time entries

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Ensure 4 AM Toronto run
        id: schedule_guard
        run: |
          TORONTO_HOUR=$(TZ=America/Toronto date +%H)
          TORONTO_DAY=$(TZ=America/Toronto date +%u)
          echo "Toronto hour: ${TORONTO_HOUR}"
          echo "Toronto weekday: ${TORONTO_DAY}"
          if [ "${TORONTO_HOUR}" = "04" ] && [ "${TORONTO_DAY}" -le 5 ]; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up DB folder
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        run: mkdir -p DB

      - name: Print current times
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        run: |
          echo "UTC: $(date -u)"
          echo "Toronto: $(TZ=America/Toronto date)"

      - name: Run scripts
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        run: |
          python scripts/tasks.py
          python scripts/clients_time_entries.py
          python scripts/content_time_entries.py
          python scripts/dev_time_entries.py
          python scripts/non_billable_time_entries.py
          python scripts/off_page_content_time_entries.py
          python scripts/all_time_entries.py
          python scripts/private_time_entries.py

      - name: Upload DB files
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-databases
          path: DB/

      - name: Upload final database artifact
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: all_time_entries
          path: DB/all_time_entries.db

      - name: Upload consolidated CSV artifact
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: all_time_entries_csv
          path: DB/all_time_entries.csv

      - name: Upload task table CSV artifact
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task_table_csv
          path: DB/tasks_table.csv

      - name: Commit and push CSVs to repo
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_pipeline == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git add DB/all_time_entries.csv DB/private.csv DB/tasks_table.csv DB/client_names.csv
          git commit -m "Auto-update CSV files [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
